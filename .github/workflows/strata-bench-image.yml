name: strata-bench-image

# Builds the Vast-compatible Strata image the bench rents. Run it by hand when
# a new Strata release should be benchmarked.
on:
  push:
    branches: [feat/strata-bench]
    paths: [docker/strata-bench/**, .github/workflows/strata-bench-image.yml]
  workflow_dispatch:
    inputs:
      version:
        description: Strata release, as in the upstream image tag (for example 0.2.9)
        required: true
        default: "0.2.9"

permissions:
  contents: read
  packages: write

jobs:
  image:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        flavor: [cuda12, cuda13]
    steps:
      - uses: actions/checkout@v4
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: docker/build-push-action@v6
        with:
          context: docker/strata-bench
          push: true
          build-args: BASE=ghcr.io/niko1221/strata:${{ inputs.version || '0.2.9' }}-${{ matrix.flavor }}
          # ghcr.io needs its package set to public once, in the web UI, before
          # Vast can pull it. ttl.sh needs no account and expires after a day,
          # which is enough to run a benchmark without waiting on that step.
          tags: |
            ghcr.io/${{ github.repository_owner }}/strata-bench:${{ inputs.version || '0.2.9' }}-${{ matrix.flavor }}
            ttl.sh/${{ github.repository_owner }}-larri-strata-bench-${{ matrix.flavor }}:24h
